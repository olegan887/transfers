name: Auto-Syndicate Routes & Guides

on:
  schedule:
    # Run every Monday, Wednesday, and Friday at 09:00 UTC
    - cron: '0 9 * * 1,3,5'
  workflow_dispatch:
    inputs:
      item_index:
        description: 'Optional rotation index override (leave blank for automatic rotation)'
        required: false
        default: ''

jobs:
  syndicate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Publish Next Route / Guide Teaser
        env:
          TELEGRAPH_ACCESS_TOKEN: ${{ secrets.TELEGRAPH_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          SYNDICATION_WEBHOOK_URL: ${{ secrets.SYNDICATION_WEBHOOK_URL }}
        run: |
          if [ -n "${{ github.event.inputs.item_index }}" ]; then
            npx tsx scripts/auto-syndicate.ts --index="${{ github.event.inputs.item_index }}"
          else
            npx tsx scripts/auto-syndicate.ts
          fi
